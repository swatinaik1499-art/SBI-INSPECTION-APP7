name: Build SBI Inspection App

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 4. INSTALL ANDROID SDK 35
      # =========================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 installed."


      # =========================================================
      # 5. VERIFY PROJECT STRUCTURE
      # =========================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT STRUCTURE"
          echo "=========================================="

          ls -la

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sbi/inspection/MainActivity.java
          test -f app/src/main/res/drawable/sbi_original.png

          echo ""
          echo "All required project files found."


      # =========================================================
      # 6. VERIFY GRADLE CONFIGURATION
      # =========================================================
      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE CONFIGURATION"
          echo "=========================================="

          echo "----- settings.gradle -----"
          cat settings.gradle

          echo ""
          echo "----- root build.gradle -----"
          cat build.gradle

          echo ""
          echo "----- app/build.gradle -----"
          cat app/build.gradle

          echo ""

          grep -q "com.android.application" app/build.gradle

          if grep -q "com.sbi.inspection" app/build.gradle; then
            echo "com.sbi.inspection found in app Gradle configuration."
          else
            echo "WARNING: com.sbi.inspection not found in app/build.gradle."
          fi

          echo "Gradle configuration check completed."


      # =========================================================
      # 7. VERIFY ANDROID MANIFEST
      # =========================================================
      - name: Verify Android manifest
        shell: bash
        run: |
          set -e

          MANIFEST="app/src/main/AndroidManifest.xml"

          echo "=========================================="
          echo "ANDROID MANIFEST"
          echo "=========================================="

          cat "$MANIFEST"

          echo ""
          echo "Checking MainActivity..."

          if grep -q 'android:name=".MainActivity"' "$MANIFEST"; then
            echo "MainActivity manifest entry found."

          elif grep -q 'android:name="com.sbi.inspection.MainActivity"' "$MANIFEST"; then
            echo "Fully qualified MainActivity manifest entry found."

          else
            echo "ERROR: MainActivity declaration not found."
            exit 1
          fi

          echo ""
          echo "Checking launcher..."

          if grep -q 'android.intent.action.MAIN' "$MANIFEST"; then
            echo "MAIN launcher action found."
          else
            echo "ERROR: MAIN launcher action not found."
            exit 1
          fi

          if grep -q 'android.intent.category.LAUNCHER' "$MANIFEST"; then
            echo "LAUNCHER category found."
          else
            echo "ERROR: LAUNCHER category not found."
            exit 1
          fi

          echo ""
          echo "Manifest verification passed."


      # =========================================================
      # 8. VERIFY MAINACTIVITY SOURCE
      # =========================================================
      - name: Verify MainActivity source
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/sbi/inspection/MainActivity.java"

          echo "=========================================="
          echo "MAIN ACTIVITY SOURCE"
          echo "=========================================="

          test -f "$FILE"

          grep -q 'package com.sbi.inspection' "$FILE"
          grep -q 'class MainActivity' "$FILE"

          echo "MainActivity source verification passed."


      # =========================================================
      # 9. VERIFY SBI LOGO
      # =========================================================
      - name: Verify SBI logo
        shell: bash
        run: |
          set -e

          LOGO="app/src/main/res/drawable/sbi_original.png"

          echo "=========================================="
          echo "SBI LOGO"
          echo "=========================================="

          test -f "$LOGO"

          SIZE=$(stat -c%s "$LOGO")

          echo "Logo size: ${SIZE} bytes"

          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: SBI logo file appears invalid."
            exit 1
          fi

          echo "SBI logo verification passed."


      # =========================================================
      # 10. PREPARE GRADLE
      # =========================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Existing Gradle wrapper found."
          else
            echo "Gradle wrapper not found."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "Installing Gradle 8.7..."

              wget -q \
                https://services.gradle.org/distributions/gradle-8.7-bin.zip \
                -O /tmp/gradle.zip

              mkdir -p /tmp/gradle

              unzip -q \
                /tmp/gradle.zip \
                -d /tmp/gradle

              export PATH="/tmp/gradle/gradle-8.7/bin:$PATH"
            fi

            gradle wrapper --gradle-version 8.7

            chmod +x ./gradlew
          fi

          echo ""
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          ./gradlew --version


      # =========================================================
      # 11. CLEAN
      # =========================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 12. COMPILE JAVA
      # =========================================================
      - name: Compile Debug Java
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 13. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 14. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "APK VERIFICATION"
          echo "=========================================="

          test -f "$APK"

          ls -lh "$APK"

          APK_SIZE=$(stat -c%s "$APK")

          echo "APK size: ${APK_SIZE} bytes"

          if [ "$APK_SIZE" -lt 10000 ]; then
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

          echo "APK exists and has valid size."


      # =========================================================
      # 15. ADD BUILD TOOLS TO PATH
      # =========================================================
      - name: Configure Android build tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          test -d "$BUILD_TOOLS"

          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

          echo "Build tools configured."


      # =========================================================
      # 16. INSPECT APK
      # =========================================================
      - name: Inspect APK with AAPT
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "APK BADGING"
          echo "=========================================="

          aapt dump badging "$APK"


      # =========================================================
      # 17. VERIFY APPLICATION PACKAGE
      # =========================================================
      - name: Verify APK package
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          aapt dump badging "$APK" > /tmp/apk-badging.txt

          echo "=========================================="
          echo "APK PACKAGE"
          echo "=========================================="

          grep "package:" /tmp/apk-badging.txt

          grep -q "package: name='com.sbi.inspection'" \
            /tmp/apk-badging.txt

          echo ""
          echo "Package verification passed."


      # =========================================================
      # 18. VERIFY APK SDK
      # =========================================================
      - name: Verify APK SDK information
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          aapt dump badging "$APK" > /tmp/apk-badging.txt

          echo "=========================================="
          echo "SDK INFORMATION"
          echo "=========================================="

          grep "sdkVersion" /tmp/apk-badging.txt

          echo ""
          echo "SDK verification passed."


      # =========================================================
      # 19. VERIFY APK ZIP INTEGRITY
      # =========================================================
      - name: Verify APK ZIP integrity
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "APK ZIP INTEGRITY"
          echo "=========================================="

          unzip -t "$APK"

          echo ""
          echo "APK ZIP integrity verification passed."


      # =========================================================
      # 20. SHA-256
      # =========================================================
      - name: Generate APK SHA-256
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "SHA-256"
          echo "=========================================="

          sha256sum "$APK" \
            | tee app/build/outputs/apk/debug/SHA256SUM.txt


      # =========================================================
      # 21. PREPARE FINAL APK
      # =========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            release/SBI-Inspection-App-FINAL.apk

          cp \
            app/build/outputs/apk/debug/SHA256SUM.txt \
            release/SHA256SUM.txt

          echo "=========================================="
          echo "FINAL RELEASE"
          echo "=========================================="

          ls -lh release


      # =========================================================
      # 22. UPLOAD FINAL APK
      # =========================================================
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: SBI-Inspection-App-FINAL
          path: release/SBI-Inspection-App-FINAL.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 23. UPLOAD DEBUG OUTPUTS
      # =========================================================
      - name: Upload debug build outputs
        uses: actions/upload-artifact@v4
        with:
          name: SBI-Inspection-App-Debug-Build
          path: |
            app/build/outputs/apk/debug/
            app/build/outputs/apk/
          if-no-files-found: warn
          retention-days: 30


      # =========================================================
      # 24. UPLOAD BUILD REPORTS
      # =========================================================
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBI-Inspection-App-Build-Reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14


      # =========================================================
      # 25. FINAL SUCCESS MESSAGE
      # =========================================================
      - name: Build summary
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo ""
          echo "       SBI INSPECTION APP BUILD SUCCESSFUL"
          echo ""
          echo "======================================================"
          echo ""
          echo "Application : SBI Inspection App"
          echo "Package     : com.sbi.inspection"
          echo "SDK         : Android 35"
          echo "Java        : 17"
          echo "APK         : SBI-Inspection-App-FINAL.apk"
          echo ""
          echo "VERIFIED:"
          echo "  [OK] Project structure"
          echo "  [OK] Gradle configuration"
          echo "  [OK] Android Manifest"
          echo "  [OK] MainActivity"
          echo "  [OK] SBI Logo"
          echo "  [OK] Java compilation"
          echo "  [OK] APK generation"
          echo "  [OK] APK package"
          echo "  [OK] SDK information"
          echo "  [OK] APK ZIP integrity"
          echo "  [OK] SHA-256"
          echo ""
          echo "======================================================"
          echo "Download the APK from GitHub Actions Artifacts."
          echo "======================================================"
